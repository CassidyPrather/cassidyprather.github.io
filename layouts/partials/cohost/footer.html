{{- /* Cohost's footer was a row of product links — about, plus!, terms, the
	staff blog. None of those exist now, so the row points at the things that
	replaced them. */ -}}
{{- $profile := site.Data.cohost -}}
<footer class="co-footer">
	<nav class="co-footer-nav" aria-label="Footer">
		<a class="co-footer-link" href="{{ "cohost/" | relURL }}">archive</a>
		<a class="co-footer-link" href="{{ "blog/" | relURL }}">blog</a>
		<a class="co-footer-link" href="{{ "guestbook/" | relURL }}">guestbook</a>
		<a class="co-footer-link" href="{{ "licenses/" | relURL }}">licenses</a>
		<a class="co-footer-link" href="{{ $profile.archive }}" rel="nofollow noopener">wayback machine</a>
	</nav>
</footer>
