{{- /* The fixed cherry bar. Cohost's logo went to the dashboard; there is no
	dashboard any more, so it goes home. */ -}}

	<div class="co-topbar-inner">
		<a class="co-logo" href="{{ site.Home.RelPermalink }}" title="cohost is gone — this way to wirenook">
			{{ partial "cohost/logo.html" . }}
		</a>
		<nav class="co-topbar-nav" aria-label="Site">

		</nav>
	</div>
</header>
