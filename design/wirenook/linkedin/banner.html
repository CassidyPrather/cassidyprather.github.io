<!doctype html>
<!--
  LinkedIn profile banner, 1584x396 (LinkedIn's recommended size), assembled
  from the site's own layers: the sky, the volumetric clouds, the grid, the
  wave lines and the wordmark. Open it in a browser to tweak; render it with

    node -e "require('playwright').chromium.launch().then(async b => { const p = await b.newPage({ viewport: { width: 1584, height: 396 }, deviceScaleFactor: 2 }); await p.goto('file://' + process.cwd() + '/design/wirenook/linkedin/banner.html'); await p.waitForTimeout(500); await p.screenshot({ path: 'design/wirenook/linkedin/linkedin-banner.png' }); await b.close(); })"

  from the repo root. The profile photo covers the lower left of the banner
  (and more of it on a phone), so everything that matters sits to the right.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>LinkedIn banner</title>
<style>
	@font-face {
		font-family: Unique;
		src: url("../../../static/fonts/Unique.ttf");
	}
	html, body {
		margin: 0;
		width: 1584px;
		height: 396px;
		overflow: hidden;
	}
	body {
		position: relative;
		background: linear-gradient(155deg, #65b8e6 0%, #519ed5 48%, #8abbe9 100%);
		font-family: Unique, sans-serif;
		color: #271452;
	}
	.layer {
		position: absolute;
		pointer-events: none;
	}
	.volume {
		width: 980px;
		left: 320px;
		top: -260px;
		opacity: 0.55;
	}
	.volume-2 {
		width: 760px;
		left: -120px;
		top: -60px;
		opacity: 0.35;
	}
	.clouds {
		width: 900px;
		right: -140px;
		bottom: -170px;
		opacity: 0.5;
	}
	.grid {
		width: 520px;
		right: 380px;
		top: -150px;
		opacity: 0.16;
	}
	.waves {
		inset: 0;
		background: url("../../../static/images/wirenook/waves.svg") repeat-x center / auto 140%;
		opacity: 0.22;
	}
	.dots {
		inset: 0 auto 0 0;
		width: 260px;
		background: radial-gradient(circle, rgba(109, 44, 149, 0.55) 1.2px, transparent 1.6px) 0 0 / 12px 12px;
		mask-image: linear-gradient(to right, #000, transparent);
		opacity: 0.6;
	}
	.mark {
		position: absolute;
		right: 70px;
		top: 50%;
		transform: translateY(-54%);
		width: 640px;
		filter: drop-shadow(0 0.6rem 1.2rem rgba(65, 24, 127, 0.25));
	}
	.rule {
		position: absolute;
		left: 0;
		right: 0;
		top: 0;
		height: 14px;
		background: repeating-linear-gradient(to right, rgba(231, 252, 255, 0.85) 0 1px, transparent 1px 16px);
	}
</style>
</head>
<body>
	<img class="layer volume volume-2" src="../../../static/images/wirenook/volumetric-clouds.png" alt="">
	<img class="layer volume" src="../../../static/images/wirenook/volumetric-clouds.png" alt="">
	<img class="layer grid" src="../../../static/images/wirenook/grid-square.png" alt="">
	<div class="layer waves"></div>
	<img class="layer clouds" src="../../../static/images/wirenook/clouds.svg" alt="">
	<div class="layer dots"></div>
	<div class="rule"></div>
	<img class="mark" src="../../../static/images/OPL/wirenook-banner-v2.png" alt="wirenook.net">
</body>
</html>
