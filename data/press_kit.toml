[logos]
weight = 2
title = "Square logos"
blurb = "The triangle lockup comes in four text placements; pick whichever fits the space. All four are white line art on transparent, 4096×4096 — the previews sit on black so you can see them."

  [[logos.items]]
  name = "link-charm.png"
  src = "images/wirenook/link-charm.png"
  note = "Favicon."

  [[logos.items]]
