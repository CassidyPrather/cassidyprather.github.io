# Everything /style/ shows, read by layouts/_default/style.html. Section order
# and presentation live in the layout; this file is the inventory.
#
# src   preview the page shows (under images/ it goes through Hugo's image
#       pipeline and gets width/height; anything else is linked verbatim)
# href  the file a click downloads, when it isn't the preview itself
# alt   alt text; also the only caption a card carries

# The triangle lockup. `main` is the hero; the lockups swap into it. Previews
# are white on black grayscale, so the page screens them onto its stage; the
# downloads are 4096² white line art on transparent.
[logo]
svg = "press-kit/logo/wirenook-tri.svg"
# The SVG's labels are live text in these faces.
svg_fonts = "Jost · Y1AlternaSans · Y1SorikomiSansSerif"
charm = { src = "images/wirenook/link-charm.png", alt = "Rabbit-head favicon" }

  [[logo.lockups]]
  src = "images/wirenook/logo/wirenook-tri-center.png"
  href = "press-kit/logo/wirenook-tri-center.png"
  alt = "Triangle mark: rabbit, WIRE NOOK stacked inside"

  [[logo.lockups]]
  src = "images/wirenook/logo/wirenook-tri-left.png"
  href = "press-kit/logo/wirenook-tri-left.png"
  alt = "Triangle mark: WIRENOOK up the left edge"

  [[logo.lockups]]
  src = "images/wirenook/logo/wirenook-tri-right.png"
  href = "press-kit/logo/wirenook-tri-right.png"
  alt = "Triangle mark: WIRENOOK up the right edge"

  [[logo.lockups]]
  src = "images/wirenook/logo/wirenook-tri-down.png"
  href = "press-kit/logo/wirenook-tri-down.png"
  alt = "Triangle mark: WIRENOOK along the base"

# Older marks. Shown small, behind a disclosure, never beside the lockups.
[[alt_logos]]
src = "press-kit/logo/wirenook-logo-1.svg"
png = "press-kit/logo/wirenook-logo-1.png"
alt = "Target rings, >WIRENOOK.NET banner, rabbit"

[[alt_logos]]
src = "press-kit/logo/wirenook-logo-2.svg"
png = "press-kit/logo/wirenook-logo-2.png"
alt = "Rabbit in a moon ring, blackletter Wirenook.Net"

[[alt_logos]]
src = "press-kit/logo/wirenook-logo-co-4.svg"
png = "press-kit/logo/wirenook-logo-co-4.png"
alt = "Target rings, >CASSIDY CO banner, rabbit"

# Colour. The site's own tokens are read straight out of
# assets/themes/wirenook/01-tokens.css by the layout, so they can't drift;
# these are the rest, sampled from the art.
[[palette]]
colors = ["#b0aed5", "#898db8", "#a88bbc", "#7179a5", "#d7dae6"]
alt = "Lightmode wallpapers"

[[palette]]
colors = ["#0b0c25", "#13153f", "#15086a", "#645e77", "#242949"]
alt = "Nightmode and dark wallpapers"

[[palette]]
colors = ["#f3ecd5", "#3288be", "#50afc8", "#5f37be", "#95fae6", "#6a3996"]
alt = "Business wallpaper and d20 socket"

[[palette]]
colors = ["#ff6600", "#0693fa", "#1a1a1a", "#f7f7f7", "#c0c0c0"]
alt = "WNN wallpapers"

# Faces. `sample` is set in the face itself.
[[type]]
family = "Unique"
file = "fonts/Unique.ttf"
sample = "wirenook"

[[type]]
family = "Atkinson-Regular"
name = "Atkinson Hyperlegible"
file = "fonts/AtkinsonHyperlegible-Regular.ttf"
sample = "Aa Bb Cc 0123"
  [[type.cuts]]
  family = "Atkinson-Italic"
  file = "fonts/AtkinsonHyperlegible-Italic.ttf"
  [[type.cuts]]
  family = "Atkinson-Bold"
  file = "fonts/AtkinsonHyperlegible-Bold.ttf"
  [[type.cuts]]
  family = "Atkinson-BoldItalic"
  file = "fonts/AtkinsonHyperlegible-BoldItalic.ttf"

# Marks and buttons. `embed` gets a copyable <a><img></a> snippet.
[[marks]]
src = "images/OPL/wirenook-banner-v2.png"
alt = "WIRENOOK.net banner: globe, orbit ring, checkered rabbit"
wide = true

[[marks]]
src = "images/wirenook/wirenook-88x31.gif"
alt = "wirenook.net"
embed = true
pixel = true

[[marks]]
src = "images/wirenook/poly-bunyn-dithered.png"
alt = "Poly Bunyn: low-poly rabbit, dithered"

# Things to print.
[[wear]]
src = "press-kit/customization/wirenook-phone.png"
alt = "Phone case: grid, WIRENOOK.net bar, icons"
source = "https://github.com/CassidyPrather/cassidyprather.github.io/raw/main/design/wirenook/phone/Wirenook_phone_resized.svg"

[[wear]]
src = "press-kit/customization/wirenook-d20-v2-notext.png"
