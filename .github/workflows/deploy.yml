name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run, so a
# queued build will still complete after the running one.
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.140.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      # design/ is ~800 MB of Git LFS art the site does not publish, so the
      # checkout above deliberately leaves LFS alone (no `lfs: true`). hugo.toml
      # mounts a few of those files into the press kit on /style/, and without
      # their content Hugo would happily publish 130-byte pointer files under
      # .png names. Read the paths back out of hugo.toml so the two never drift,
      # then fail loudly if anything is still a pointer afterwards.
      - name: Fetch press-kit assets from Git LFS
        run: |
          mapfile -t paths < <(sed -n 's/^ *source = "\(design\/[^"]*\)"/\1/p' hugo.toml)
          if [ "${#paths[@]}" -eq 0 ]; then
            echo "::error::no design/ mounts found in hugo.toml"
            exit 1
          fi
          printf 'fetching %s\n' "${paths[@]}"
          git lfs install --local
          git lfs pull --include="$(IFS=,; echo "${paths[*]}")" --exclude=""
          status=0
          for path in "${paths[@]}"; do
            if head -c 40 "$path" | grep -q 'git-lfs.github.com'; then
              echo "::error file=$path::still an LFS pointer after git lfs pull"
              status=1
            fi
          done
          exit "$status"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
