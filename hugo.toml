baseURL = "https://cassidyprather.github.io/"
languageCode = "en"
title = "wirenook"
enableRobotsTXT = true

# Skip the unused taxonomies (tags/categories) to keep the published site to
# just the pages we author. The feed is off by default too ([outputs] below);
# the blog section opts back in via its front matter.
disableKinds = ["taxonomy", "term"]

# Publish future-dated posts immediately — a timestamp a few hours ahead
# should never silently drop a post from a deploy.
buildFuture = true

# Take each post's Lastmod from the commit that last touched its file, which is
# what gives <updated> in the Atom feed something to say: a corrected post
# resurfaces in a reader, an untouched one stays put, and nobody has to
# maintain a field by hand to make that true.
#
# Two consequences worth knowing. Every workflow that builds the site checks
# out full history for this (`fetch-depth: 0`) — from GitHub's default shallow
# clone there is no log to read and every post falls back to its publication
# date. And a mechanical sweep across content, a typo pass or a reformat, is a
# commit against every file it touches and reads as an update to every one of
# those posts; git outranks a `lastmod` in front matter by default, so if that
# ever needs suppressing, the fix is a [frontmatter] table putting "lastmod"
# ahead of ":git" and pinning the field on the posts that should stop tracking
# their file.
enableGitInfo = true

[outputs]
  home = ["html"]
  section = ["html"]

# CI passes --baseURL from the Pages configuration step, so the value above
# is only a fallback for local builds.

# The blog syndicates as Atom (layouts/blog/list.rss.xml), which Hugo has no
# media type for, so declaring the format means declaring the type first. The
# suffix names the published file and is half of the layout lookup: baseName
# plus suffix is /blog/feed.xml, format key plus suffix is list.rss.xml.
#
# That key is the one piece of this that still says RSS, and it has to. Hugo
# rewrites root-relative URLs in rendered content to absolute ones for exactly
# one output format — the one named "rss", by literal string comparison in
# hugolib/site.go, which is still how it works upstream today. Every image in
# a post arrives as a root-relative path from responsive-image.html, and a
# path is resolved by a feed reader against whatever host the *reader* lives
# on, so without that pass every attachment in the cohost archive breaks for
# every subscriber. Nothing else about the format is RSS: the media type, the
# published file, the template and the autodiscovery links all say Atom.
#
# Both tables merge with Hugo's built-ins rather than replacing them, unlike
# the module mounts at the bottom of this file — so overriding "rss" here
# changes the media type and file name of Hugo's own format and leaves the
# rest of its defaults alone.
[mediaTypes]
  [mediaTypes."application/atom+xml"]
    suffixes = ["xml"]

[outputFormats]
  [outputFormats.rss]
    mediaType = "application/atom+xml"
    baseName = "feed"

[params]
  description = "Cassidy Prather's Website"
  author = "Cassidy Prather"

  [params.feed]
    # Authority and date for the RFC 4151 tag: URIs that identify feed entries.
    #
    # Both are constants, and deliberately not read off baseURL: an entry's
    # <id> is what a reader keys its copy on, so the day it starts tracking
    # where the site is served from is the day a move republishes the whole
    # archive into everyone's reader. That is the one thing Atom is here to
    # avoid. baseURL is not even stable today — CI overrides it from the Pages
    # configuration step, and the site answers to wirenook.net.
    #
    # The date only has to be a year the authority was ours, and marks when
    # these ids were minted; it is not a per-entry timestamp. Neither value
    # can change now that the feed is published.
    tagAuthority = "wirenook.net"
    tagDate = "2026"

  [params.blog]
    # How many posts the blog feed takes to slide from the wirenook skin into
    # the cohost one, counted from the first cohost-era post downwards. Lower
    # is a sharper handover, higher is a longer fade; the floor is 2, since one
    # post is just a cut. layouts/partials/blog/drift.html reads this.
    archiveFade = 8

[markup.goldmark.renderer]
  unsafe = true

# design/ is the working art library: ~800 MB of Git LFS sources that the site
# deliberately does not publish. The press kit on /style/ offers a handful of
# those files, so each one is mounted individually — a whole-directory mount
# would put the multi-hundred-megabyte sources on the deploy, and globbing
# would publish new art the moment it landed in the library.
#
# Declaring any mount for the "static" target replaces Hugo's default for that
# target, so the default is restated first. Names are rewritten to the
# lowercase kebab-case the rest of static/ uses (static/images/README.md).
#
# .github/workflows/deploy.yml fetches exactly these paths from LFS; keep the
# two lists in step or the build publishes 130-byte pointer files as art.
[module]
  [[module.mounts]]
    source = "static"
    target = "static"

  # The same images again, this time where Hugo's image pipeline can reach them.
  # Only assets/ is processable, and the committed files under static/images are
  # full-resolution masters, so without this mount every <img> would have to
  # ship a master (2370x3300 for a 158 CSS px slot, in the worst case). Mounting
  # rather than moving keeps static/ publishing them verbatim, so the site still
  # serves its own sources and the press-kit mounts below are unaffected.
  # layouts/partials/responsive-image.html is the consumer.
  #
  # The same replace-the-default rule that applies to "static" above applies
  # here: naming an "assets" target drops Hugo's built-in assets mount, which
  # would take styles.css and script.js down with it, so restate it first.
  [[module.mounts]]
    source = "assets"
    target = "assets"

  [[module.mounts]]
    source = "static/images"
    target = "assets/images"

  [[module.mounts]]
    source = "design/wirenook/logo/Wirenook_design_1.svg"
    target = "static/press-kit/logo/wirenook-logo-1.svg"

  [[module.mounts]]
    source = "design/wirenook/logo/Wirenook_design_1.png"
    target = "static/press-kit/logo/wirenook-logo-1.png"

  [[module.mounts]]
    source = "design/wirenook/logo/Wirenook_design_2.svg"
    target = "static/press-kit/logo/wirenook-logo-2.svg"

  [[module.mounts]]
    source = "design/wirenook/logo/Wirenook_design_2.png"
    target = "static/press-kit/logo/wirenook-logo-2.png"

  [[module.mounts]]
    source = "design/wirenook/logo/Wirenook_co_design_4.svg"
    target = "static/press-kit/logo/wirenook-logo-co-4.svg"

  [[module.mounts]]
    source = "design/wirenook/logo/Wirenook_co_design_4.png"
    target = "static/press-kit/logo/wirenook-logo-co-4.png"

  [[module.mounts]]
    source = "design/wirenook/phone/Wirenook_phone_resized.png"
    target = "static/press-kit/customization/wirenook-phone.png"

  [[module.mounts]]
    source = "design/wirenook/phone/socket/wirenook_d20_v2.png"
    target = "static/press-kit/customization/wirenook-d20-v2.png"

  [[module.mounts]]
    source = "design/wirenook/phone/socket/wirenook_d20_v2_resize_notext-FINAL.png"
    target = "static/press-kit/customization/wirenook-d20-v2-notext.png"
